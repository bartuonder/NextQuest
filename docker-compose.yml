services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nextquest
      POSTGRES_PASSWORD: nextquest
      POSTGRES_DB: nextquest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextquest"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # The OpenAI and LangChain keys come straight from .env, so the same file
    # works whether you run uvicorn locally or the container.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://nextquest:nextquest@db:5432/nextquest
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"

volumes:
  pgdata:
